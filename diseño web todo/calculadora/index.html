<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora mega pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculadora-container">
        <section class="asd">
            <h1>Calculadora style Leonel Coronel</h1>
        </section>

        <div class="input-group">
            <p>Ingrese un valor:</p> 
            <input type="number" id="numero1" placeholder="0">
        </div>

        <div class="input-group">
            <p>Ingrese un valor:</p> 
            <input type="number" id="numero2" placeholder="0">
        </div>

        <div class="botones">
            <button onclick="sumar()">Sumar</button>
            <button onclick="restar()">Restar</button>
            <button onclick="multiplicar()">Multiplicar</button>
            <button onclick="dividir()">Dividir</button>
        </div>
        
        <p id="resultado">Resultado: <span>-</span></p>
    </div>

    <script src="calculadora-s-m.js"></script>
</body>
</html>
